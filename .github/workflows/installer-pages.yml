name: RoomHub installer pages

on:
  push:
    branches:
      - main
    paths:
      - "installer/**"
      - "tools/prepare_installer_site.py"
      - "tools/test_prepare_installer_site.py"
      - ".github/workflows/installer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out installer source
        uses: actions/checkout@v7

      - name: Download latest published endpoint manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download --pattern manifest.json --pattern '*-factory.bin' --dir release
          python tools/prepare_installer_site.py release installer

      - name: Test installer site assembly
        run: python -m unittest tools/test_prepare_installer_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload installer site
        uses: actions/upload-pages-artifact@v4
        with:
          path: installer

      - name: Deploy installer site
        id: deployment
        uses: actions/deploy-pages@v5
