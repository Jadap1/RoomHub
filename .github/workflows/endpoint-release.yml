name: RoomHub endpoint release

on:
  push:
    tags:
      - "endpoint-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v5.4.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#endpoint-v}"
          configured="$(sed -nE 's/^project\(roomhub_endpoint VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)$/\1/p' firmware/endpoint/CMakeLists.txt)"
          test "$version" = "$configured"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build endpoint
        working-directory: firmware/endpoint
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py --version
          riscv32-esp-elf-gcc --version | head -n 1
          idf.py build

      - name: Build memory-bounded ESP32-C6 firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          python tools/prepare_wireless_firmware.py \
            firmware/endpoint/managed_components/espressif__esp_hosted/slave \
            "$RUNNER_TEMP/roomhub-wireless"
          cd "$RUNNER_TEMP/roomhub-wireless"
          idf.py set-target esp32c6
          idf.py build
          cp build/network_adapter.bin \
            "$GITHUB_WORKSPACE/firmware/endpoint/roomhub-tab5-c6-1.4.2.bin"

      - name: Restore protected signing key
        shell: bash
        env:
          ENDPOINT_SIGNING_KEY_B64: ${{ secrets.ENDPOINT_SIGNING_KEY_B64 }}
        run: |
          test -n "$ENDPOINT_SIGNING_KEY_B64"
          printf '%s' "$ENDPOINT_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/roomhub-endpoint.pem"
          chmod 600 "$RUNNER_TEMP/roomhub-endpoint.pem"

      - name: Sign and package release
        working-directory: firmware/endpoint
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          python tools/package_release.py \
            --key "$RUNNER_TEMP/roomhub-endpoint.pem" \
            --version "${{ steps.version.outputs.version }}" \
            --download-base-url \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          cp roomhub-tab5-c6-1.4.2.bin dist/
          sha256sum roomhub-tab5-c6-1.4.2.bin >> dist/SHA256SUMS

      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/roomhub-endpoint.pem"

      - name: Upload release bundle
        uses: actions/upload-artifact@v6
        with:
          name: endpoint-${{ steps.version.outputs.version }}
          path: firmware/endpoint/dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v7
        with:
          pattern: endpoint-*
          path: dist
          merge-multiple: true

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --verify-tag
          --draft
          --generate-notes
          --title "RoomHub endpoint ${GITHUB_REF_NAME#endpoint-v}"
