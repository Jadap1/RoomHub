name: RoomHub endpoint release

on:
  push:
    tags:
      - "endpoint-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v5.4.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#endpoint-v}"
          configured="$(sed -n 's/.*VERSION \([0-9][^)]*\)).*/\1/p' firmware/endpoint/CMakeLists.txt)"
          test "$version" = "$configured"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build endpoint
        working-directory: firmware/endpoint
        run: idf.py build

      - name: Restore protected signing key
        shell: bash
        env:
          ENDPOINT_SIGNING_KEY_B64: ${{ secrets.ENDPOINT_SIGNING_KEY_B64 }}
        run: |
          test -n "$ENDPOINT_SIGNING_KEY_B64"
          printf '%s' "$ENDPOINT_SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/roomhub-endpoint.pem"
          chmod 600 "$RUNNER_TEMP/roomhub-endpoint.pem"

      - name: Sign and package release
        working-directory: firmware/endpoint
        run: >-
          python tools/package_release.py
          --key "$RUNNER_TEMP/roomhub-endpoint.pem"
          --version "${{ steps.version.outputs.version }}"
          --download-base-url
          "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/roomhub-endpoint.pem"

      - name: Upload release bundle
        uses: actions/upload-artifact@v6
        with:
          name: endpoint-${{ steps.version.outputs.version }}
          path: firmware/endpoint/dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v7
        with:
          pattern: endpoint-*
          path: dist
          merge-multiple: true

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --verify-tag
          --generate-notes
          --title "RoomHub endpoint ${GITHUB_REF_NAME#endpoint-v}"

  installer:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release manifest
        uses: actions/download-artifact@v7
        with:
          pattern: endpoint-*
          path: release
          merge-multiple: true

      - name: Assemble installer site
        run: cp release/manifest.json installer/manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload installer site
        uses: actions/upload-pages-artifact@v4
        with:
          path: installer

      - name: Deploy installer site
        id: deployment
        uses: actions/deploy-pages@v5
